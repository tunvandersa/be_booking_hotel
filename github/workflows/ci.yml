name: ASP.NET Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore do-an-epu.sln

      - name: Build
        run: dotnet build do-an-epu.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test do-an-epu.sln --configuration Release --no-build
